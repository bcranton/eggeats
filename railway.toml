[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
# Build context is the repo root so both backend/ and frontend/ are available
watchPatterns = ["backend/**", "frontend/**"]

[deploy]
startCommand = "{ alembic upgrade head && echo '=== alembic OK ===' && python -c 'from app.main import app; print(\"Import OK\")' && echo '=== import OK ===' && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT; } 2>&1"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
