<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favicon Options</title>
  <style>
    body { background: #1c1c24; color: #eeeef2; font-family: sans-serif; padding: 40px; }
    h1 { color: #c0253a; margin-bottom: 32px; }
    .grid { display: flex; gap: 48px; flex-wrap: wrap; }
    .option { text-align: center; }
    .option p { margin: 12px 0 4px; font-size: 14px; color: #888899; }
    .sizes { display: flex; gap: 16px; align-items: flex-end; justify-content: center; margin-top: 8px; }
    .sizes img { display: block; image-rendering: pixelated; }
    label { font-size: 11px; color: #555566; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Favicon Options — Egg Eats</h1>
  <div class="grid">

    <div class="option">
      <div class="sizes">
        <div><img src="favicon-option1.svg" width="16" height="16"><label>16px</label></div>
        <div><img src="favicon-option1.svg" width="32" height="32"><label>32px</label></div>
        <div><img src="favicon-option1.svg" width="64" height="64"><label>64px</label></div>
        <div><img src="favicon-option1.svg" width="128" height="128"><label>128px</label></div>
      </div>
      <p>Option 1 — Fried egg on dark circle</p>
    </div>

    <div class="option">
      <div class="sizes">
        <div><img src="favicon-option2.svg" width="16" height="16"><label>16px</label></div>
        <div><img src="favicon-option2.svg" width="32" height="32"><label>32px</label></div>
        <div><img src="favicon-option2.svg" width="64" height="64"><label>64px</label></div>
        <div><img src="favicon-option2.svg" width="128" height="128"><label>128px</label></div>
      </div>
      <p>Option 2 — Map pin with yolk</p>
    </div>

    <div class="option">
      <div class="sizes">
        <div><img src="favicon-option3.svg" width="16" height="16"><label>16px</label></div>
        <div><img src="favicon-option3.svg" width="32" height="32"><label>32px</label></div>
        <div><img src="favicon-option3.svg" width="64" height="64"><label>64px</label></div>
        <div><img src="favicon-option3.svg" width="128" height="128"><label>128px</label></div>
      </div>
      <p>Option 3 — "EE" monogram</p>
    </div>

    <div class="option">
      <div class="sizes">
        <div><img src="favicon-option4.svg" width="16" height="16"><label>16px</label></div>
        <div><img src="favicon-option4.svg" width="32" height="32"><label>32px</label></div>
        <div><img src="favicon-option4.svg" width="64" height="64"><label>64px</label></div>
        <div><img src="favicon-option4.svg" width="128" height="128"><label>128px</label></div>
      </div>
      <p>Option 4 — Egg in a frying pan</p>
    </div>

  </div>
</body>
</html>
