<!-- Option 1: Fried egg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#1c1c24"/>
  <!-- Egg white -->
  <ellipse cx="16" cy="18" rx="11" ry="8" fill="#eeeef2"/>
  <!-- Irregular egg white blob -->
  <ellipse cx="13" cy="19" rx="5" ry="4" fill="#eeeef2"/>
  <ellipse cx="19" cy="20" rx="4" ry="3.5" fill="#eeeef2"/>
  <!-- Yolk -->
  <circle cx="16" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="14.5" cy="15.5" r="1.5" fill="#fbbf24" opacity="0.6"/>
</svg>
