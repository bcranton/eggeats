<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Egg Eats — Northernlion's Food & Restaurant Guide</title>
  <meta name="description" content="Every restaurant, café, and food spot visited by Northernlion (Ryan Letourneau), mapped and reviewed. Find NL's picks in Vancouver, Toronto, and more." />
  <meta name="keywords" content="Northernlion, NL, Ryan Letourneau, restaurant guide, food map, Northernlion food, Northernlion restaurant, Northernlion Vancouver, Northernlion Toronto, egg eats" />
  <link rel="canonical" href="https://eggeats.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eggeats.com/" />
  <meta property="og:site_name" content="Egg Eats" />
  <meta property="og:title" content="Egg Eats — Northernlion's Food & Restaurant Guide" />
  <meta property="og:description" content="Every restaurant, café, and food spot visited by Northernlion (Ryan Letourneau), mapped and reviewed. Find NL's picks in Vancouver, Toronto, and more." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Egg Eats — Northernlion's Food & Restaurant Guide" />
  <meta name="twitter:description" content="Every restaurant, café, and food spot visited by Northernlion, mapped and reviewed." />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Egg Eats",
    "url": "https://eggeats.com/",
    "description": "Every restaurant, café, and food spot visited by Northernlion (Ryan Letourneau), mapped and reviewed.",
    "about": {
      "@type": "Person",
      "name": "Northernlion",
      "alternateName": ["NL", "Ryan Letourneau"],
      "sameAs": [
        "https://www.youtube.com/@Northernlion",
        "https://www.twitch.tv/northernlion"
      ]
    }
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="google-adsense-account" content="ca-pub-1119004330026091">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- Pin hover tooltip -->
<div id="pin-tooltip" class="pin-tooltip"></div>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p style="font-size:14px; color: var(--color-text-muted);">Loading map data…</p>
</div>

<!-- Site header: centered title + subtitle -->
<div class="site-header">
  <a class="kofi-header-link" href="https://ko-fi.com/X8X51WTFLZ" target="_blank" rel="noopener" title="Support Egg Eats on Ko-fi">
    <img src="https://storage.ko-fi.com/cdn/brandasset/v2/support_me_on_kofi_badge_beige.png" alt="Support me on Ko-fi" />
  </a>
  <h1>Egg Eats</h1>
  <p class="subtitle">A Northernlion Travel Guide</p>
</div>

<!-- City selector: full-width row so it aligns with the centered title -->
<div class="city-bar">
  <select class="city-select" id="filter-city"></select>
  <button class="list-toggle-btn" id="btn-list-toggle" title="Switch to list view">☰ List</button>
  <button class="mobile-filter-btn" id="mobile-filter-btn" aria-label="Open filters">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Filters
  </button>
</div>

<!-- Main layout: filters | map | stats -->
<div class="app-wrapper">

  <!-- Left: Filters -->
  <aside class="filter-panel" id="filter-panel">
    <h3 class="panel-heading">Filters</h3>

    <div class="filter-group">
      <label>Search</label>
      <input class="filter-input" type="search" id="filter-search" placeholder="Place name…" autocomplete="off" />
    </div>

    <div class="filter-group">
      <label>Category</label>
      <select class="filter-select" id="filter-category">
        <option value="">All</option>
        <option value="restaurant">Restaurant</option>
        <option value="cafe">Cafe</option>
        <option value="bar">Bar</option>
        <option value="bakery">Bakery</option>
        <option value="market">Market</option>
        <option value="shop">Shop</option>
        <option value="attraction">Attraction</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="filter-group">
      <label>NL's Review</label>
      <div class="sentiment-buttons">
        <button class="sentiment-btn" data-sentiment="positive">👍 Positive</button>
        <button class="sentiment-btn" data-sentiment="negative">👎 Negative</button>
        <button class="sentiment-btn" data-sentiment="neutral">😐 Neutral</button>
        <button class="sentiment-btn" data-sentiment="mixed">🤔 Mixed</button>
      </div>
    </div>

    <div class="filter-group">
      <label>Date Mentioned</label>
      <div class="date-preset-buttons">
        <button class="date-btn" data-preset="week">Last Week</button>
        <button class="date-btn" data-preset="month">Last Month</button>
        <button class="date-btn" data-preset="year">Last 12 Months</button>
        <button class="date-btn" data-preset="custom">Custom…</button>
      </div>
      <div class="date-custom-range" id="date-custom-range" style="display:none;">
        <input type="date" id="date-from" class="filter-input" />
        <span class="date-range-sep">to</span>
        <input type="date" id="date-to" class="filter-input" />
      </div>
    </div>

    <div class="filter-group">
      <label class="checkbox-label">
        <input type="checkbox" id="filter-show-closed" checked />
        Show closed
      </label>
    </div>
  </aside>

  <!-- Center: map / list view -->
  <div class="map-wrapper">
    <div id="map"></div>
    <div id="map-empty-state" class="map-empty-state hidden">
      <p>No places match the current filters.</p>
      <button class="btn btn-secondary" id="btn-clear-filters">Clear filters</button>
    </div>
    <div id="list-view" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="list-view-header">
        <span class="panel-heading" id="list-view-title">No Fixed Location</span>
        <span id="list-view-subtitle" style="font-size:12px;color:var(--color-text-muted);">Chains and places reviewed without a specific location</span>
      </div>
      <div id="list-view-body" class="list-view-body"></div>
    </div>
    <!-- Unlocated businesses drawer (city businesses with no coordinates) -->
    <div id="unlocated-drawer" class="unlocated-drawer" style="display:none;">
      <button class="unlocated-drawer-handle" id="unlocated-drawer-handle" aria-expanded="false">
        <span class="unlocated-drawer-pill"></span>
        <span class="unlocated-drawer-icon">📍</span>
        <span id="unlocated-drawer-label">More places without a pin</span>
        <span class="unlocated-drawer-badge" id="unlocated-drawer-badge"></span>
      </button>
      <div class="unlocated-drawer-body" id="unlocated-drawer-body"></div>
    </div>
  </div>

  <!-- Right: empty sidebar (ad space on desktop) -->
  <div class="ad-sidebar" id="ad-sidebar"></div>

</div>

<!-- Bottom ad strip (desktop only) -->
<div class="ad-bottom" id="ad-bottom"></div>

<!-- Business info panel (slides over the map) -->
<aside class="info-panel" id="info-panel">
  <div class="info-panel-header">
    <div class="panel-header-top">
      <div class="business-name" id="panel-name">–</div>
      <button class="close-btn" id="panel-close" title="Close">✕</button>
    </div>
    <div class="info-panel-address" id="panel-address"></div>
    <div class="info-panel-meta" id="panel-meta"></div>
    <div class="panel-nav" id="panel-nav">
      <button class="panel-nav-btn" id="panel-prev" title="Previous place">&#8592;</button>
      <span class="panel-nav-counter" id="panel-nav-counter"></span>
      <button class="panel-nav-btn" id="panel-next" title="Next place">&#8594;</button>
    </div>
  </div>
  <div class="info-panel-body" id="panel-body"></div>
</aside>

<!-- Mobile overlay (dims map behind filter drawer) -->
<div class="mobile-overlay" id="mobile-overlay"></div>


<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="/js/map.js?v=6"></script>
</body>
</html>
