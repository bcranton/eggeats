<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egg Eats</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p style="font-size:14px; color: var(--color-text-muted);">Loading map data…</p>
</div>

<!-- Site header: centered title + subtitle -->
<div class="site-header">
  <a href="/admin.html" class="admin-link">Admin</a>
  <h1>Egg Eats</h1>
  <p class="subtitle">A Northernlion Travel Guide</p>
</div>

<!-- Main layout: filters | map | stats -->
<div class="app-wrapper">

  <!-- Left: Filters -->
  <aside class="filter-panel">
    <h3 class="panel-heading">Filters</h3>

    <div class="filter-group">
      <label>Category</label>
      <select class="filter-select" id="filter-category">
        <option value="">All</option>
        <option value="restaurant">Restaurant</option>
        <option value="cafe">Cafe</option>
        <option value="bar">Bar</option>
        <option value="bakery">Bakery</option>
        <option value="market">Market</option>
        <option value="shop">Shop</option>
        <option value="attraction">Attraction</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="filter-group">
      <label>NL's Vibe</label>
      <div class="sentiment-buttons">
        <button class="sentiment-btn" data-sentiment="positive">👍 Positive</button>
        <button class="sentiment-btn" data-sentiment="negative">👎 Negative</button>
        <button class="sentiment-btn" data-sentiment="neutral">😐 Neutral</button>
        <button class="sentiment-btn" data-sentiment="mixed">🤔 Mixed</button>
      </div>
    </div>

    <div class="filter-group">
      <label class="checkbox-label">
        <input type="checkbox" id="filter-show-closed" checked />
        Show closed
      </label>
    </div>
  </aside>

  <!-- Center: city bar + map -->
  <div class="map-wrapper">
    <div class="city-bar">
      <select class="city-select" id="filter-city"></select>
    </div>
    <div id="map"></div>
  </div>

  <!-- Right: Stats -->
  <aside class="stats-panel">
    <h3 class="panel-heading">Stats</h3>
    <div class="stat-box">
      <div class="num" id="stat-places">–</div>
      <div class="label">Places</div>
    </div>
    <div class="stat-box">
      <div class="num" id="stat-mentions">–</div>
      <div class="label">Mentions</div>
    </div>
  </aside>

</div>

<!-- Business info panel (slides over the map) -->
<aside class="info-panel" id="info-panel">
  <div class="info-panel-header">
    <div class="business-name" id="panel-name">–</div>
    <button class="close-btn" id="panel-close" title="Close">✕</button>
  </div>
  <div class="info-panel-meta" id="panel-meta"></div>
  <div class="info-panel-body" id="panel-body"></div>
  <div class="info-panel-address" id="panel-address"></div>
</aside>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
