<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Egg Eats</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p style="font-size:14px; color: var(--color-text-muted);">Loading map data…</p>
</div>

<!-- Site header: centered title + subtitle -->
<div class="site-header">
<h1>Egg Eats</h1>
  <p class="subtitle">A Northernlion Travel Guide</p>
</div>

<!-- City selector: full-width row so it aligns with the centered title -->
<div class="city-bar">
  <select class="city-select" id="filter-city"></select>
  <button class="mobile-filter-btn" id="mobile-filter-btn" aria-label="Open filters">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Filters
  </button>
</div>

<!-- Main layout: filters | map | stats -->
<div class="app-wrapper">

  <!-- Left: Filters -->
  <aside class="filter-panel" id="filter-panel">
    <h3 class="panel-heading">Filters</h3>

    <div class="filter-group">
      <label>Category</label>
      <select class="filter-select" id="filter-category">
        <option value="">All</option>
        <option value="restaurant">Restaurant</option>
        <option value="cafe">Cafe</option>
        <option value="bar">Bar</option>
        <option value="bakery">Bakery</option>
        <option value="market">Market</option>
        <option value="shop">Shop</option>
        <option value="attraction">Attraction</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="filter-group">
      <label>NL's Vibe</label>
      <div class="sentiment-buttons">
        <button class="sentiment-btn" data-sentiment="positive">👍 Positive</button>
        <button class="sentiment-btn" data-sentiment="negative">👎 Negative</button>
        <button class="sentiment-btn" data-sentiment="neutral">😐 Neutral</button>
        <button class="sentiment-btn" data-sentiment="mixed">🤔 Mixed</button>
      </div>
    </div>

    <div class="filter-group">
      <label class="checkbox-label">
        <input type="checkbox" id="filter-show-closed" checked />
        Show closed
      </label>
    </div>
  </aside>

  <!-- Center: map / list view -->
  <div class="map-wrapper">
    <div id="map"></div>
    <div id="list-view" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="list-view-header">
        <span class="panel-heading">No Fixed Location</span>
        <span style="font-size:12px;color:var(--color-text-muted);">Chains and places reviewed without a specific location</span>
      </div>
      <div id="list-view-body" class="list-view-body"></div>
    </div>
    <!-- Unlocated businesses drawer (city businesses with no coordinates) -->
    <div id="unlocated-drawer" class="unlocated-drawer" style="display:none;">
      <button class="unlocated-drawer-handle" id="unlocated-drawer-handle" aria-expanded="false">
        <span class="unlocated-drawer-pill"></span>
        <span id="unlocated-drawer-label">↑ Places without a location</span>
      </button>
      <div class="unlocated-drawer-body" id="unlocated-drawer-body"></div>
    </div>
  </div>

  <!-- Right: stats -->
  <aside class="stats-panel">
    <div class="stats-block">
      <div class="panel-heading">On the map</div>
      <div class="stats-inline">
        <span class="num" id="stat-places">–</span>
        <span class="label">places</span>
        <span class="stat-sep">/</span>
        <span class="num" id="stat-mentions">–</span>
        <span class="label">mentions</span>
      </div>
    </div>
    <div class="stats-block" id="no-location-stat" style="display:none">
      <div class="panel-heading">No location</div>
      <div class="stats-inline">
        <span class="num" id="stat-no-location">–</span>
        <span class="label">places</span>
      </div>
    </div>
  </aside>

</div>

<!-- Business info panel (slides over the map) -->
<aside class="info-panel" id="info-panel">
  <div class="info-panel-header">
    <div class="panel-header-top">
      <div class="business-name" id="panel-name">–</div>
      <button class="close-btn" id="panel-close" title="Close">✕</button>
    </div>
    <div class="info-panel-meta" id="panel-meta"></div>
    <div class="panel-nav" id="panel-nav">
      <button class="panel-nav-btn" id="panel-prev" title="Previous place">&#8592;</button>
      <span class="panel-nav-counter" id="panel-nav-counter"></span>
      <button class="panel-nav-btn" id="panel-next" title="Next place">&#8594;</button>
    </div>
  </div>
  <div class="info-panel-body" id="panel-body"></div>
  <div class="info-panel-address" id="panel-address"></div>
</aside>

<!-- Mobile overlay (dims map behind filter drawer) -->
<div class="mobile-overlay" id="mobile-overlay"></div>

<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
<script>
  kofiWidgetOverlay.draw('X8X51WTFLZ', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': 'Support Egg Eats',
    'floating-chat.donateButton.background-color': '#c0253a',
    'floating-chat.donateButton.text-color': '#fff',
  });
</script>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
