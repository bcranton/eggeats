<!-- Option 4: Egg in a frying pan -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#1c1c24"/>
  <!-- Pan handle -->
  <rect x="22" y="17" width="9" height="3" rx="1.5" fill="#888899"/>
  <!-- Pan (circle, crimson) -->
  <circle cx="14" cy="18" r="10" fill="#c0253a"/>
  <circle cx="14" cy="18" r="8.5" fill="#2c2c38"/>
  <!-- Egg white -->
  <ellipse cx="14" cy="19" rx="6.5" ry="5" fill="#eeeef2"/>
  <ellipse cx="11.5" cy="20" rx="3" ry="2.5" fill="#eeeef2"/>
  <!-- Yolk -->
  <circle cx="14" cy="18" r="3.5" fill="#f59e0b"/>
  <circle cx="12.8" cy="16.8" r="1" fill="#fbbf24" opacity="0.6"/>
</svg>
