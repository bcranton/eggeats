<!-- Option 3: Bold "EE" monogram -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#1c1c24"/>
  <!-- Crimson accent bar top -->
  <rect x="0" y="0" width="32" height="4" rx="2" fill="#c0253a"/>
  <!-- E letter left -->
  <rect x="3" y="7" width="10" height="3" fill="#eeeef2"/>
  <rect x="3" y="7" width="3" height="18" fill="#eeeef2"/>
  <rect x="3" y="14.5" width="8" height="2.5" fill="#eeeef2"/>
  <rect x="3" y="22" width="10" height="3" fill="#eeeef2"/>
  <!-- E letter right -->
  <rect x="16" y="7" width="10" height="3" fill="#c0253a"/>
  <rect x="16" y="7" width="3" height="18" fill="#c0253a"/>
  <rect x="16" y="14.5" width="8" height="2.5" fill="#c0253a"/>
  <rect x="16" y="22" width="10" height="3" fill="#c0253a"/>
</svg>
